stages:
  - build
  - initdb
  - deploy


.conds: &conditions
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
      variables:
        ENVIRONMENT_NAME: dev
    - if: $CI_COMMIT_TAG
      when: always
      variables:
        ENVIRONMENT_NAME: production    
    - when: never  

build:api:
  stage: build
  image: docker:20.10.16-dind
  tags:
    - "gitlab-org-docker"
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$ENV_FILE" > .env.development
    - echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f api.Dockerfile .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
    - echo "Docker image built and pushed successfully."
  <<: *conditions
  environment:
    name: $ENVIRONMENT_NAME
    action: prepare

build:web:
  stage: build
  image: node:lts
  tags:
    - "gitlab-org-docker"
  script:
    - echo "$ENV_FILE" > .env.development
    - npm install
    - echo "Building WEB..."
    - npm run build:web:prod
    - echo "WEB build completed. Packing..."
    - echo "$WEB_HTACCESS" > dist/apps/web/.htaccess
    - mkdir -p artifacts 
    - tar -czf artifacts/web-${CI_COMMIT_SHORT_SHA}.tar.gz -C dist/apps/web .
  artifacts:
    paths:
      - artifacts/web-${CI_COMMIT_SHORT_SHA}.tar.gz
    expire_in: 1 week  
  <<: *conditions  
  environment:
    name: $ENVIRONMENT_NAME
    action: prepare

