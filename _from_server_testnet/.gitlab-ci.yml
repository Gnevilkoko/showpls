deploy:api:
  stage: deploy
  needs:
    - build:api
  image: alpine:latest
  tags:
    - "gitlab-org-docker"
  before_script:
    - echo "Setting up SSH..."
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "SSH setup complete."
  script:
    - echo "Connecting to VPS $VPS_SSH_HOST and deploying..."
    - |
      ssh $VPS_SSH_USER@$VPS_SSH_HOST << EOF
      echo "Logging in to Docker registry..."
      echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin
      echo "Pulling image: $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
      docker pull $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}
      # docker pull $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}-code
      echo "Performing database migrations..."
      docker run --rm --network host --name showpls-demo-migrations $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA} /bin/sh ./run-migrations.sh
      echo "Stopping and removing existing container (showpls-demo)..."
      docker stop showpls-demo || true
      docker rm showpls-demo || true
      echo "Starting new container..."
      docker run -d \
        --name showpls-demo \
        --network host \
        --restart always \
        --log-driver=fluentd \
        --log-opt fluentd-address=127.0.0.1:24224 \
        --log-opt tag="showpls-demo.api" \
        $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}
      echo "Deployment complete on $VPS_SSH_HOST."
      EOF
    - echo "Successfully deployed." 
  variables:
    API_PORT: 3001
  <<: *conditions
  environment:
    name: $ENVIRONMENT_NAME
    action: start

deploy:web:
  stage: deploy
  image: alpine:latest
  needs:
    - build:web
  dependencies:
    - build:web
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$BEGET_SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$BEGET_SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh $BEGET_SSH_USER@$BEGET_SSH_HOST "mkdir -p ~/demo.showpls.com/public_html"
    - rsync -avz artifacts/web-${CI_COMMIT_SHORT_SHA}.tar.gz $BEGET_SSH_USER@$BEGET_SSH_HOST:~/demo.showpls.com/web-${CI_COMMIT_SHORT_SHA}.tar.gz
    - ssh $BEGET_SSH_USER@$BEGET_SSH_HOST "rm -rf ~/demo.showpls.com/public_html/* && tar -xzf ~/demo.showpls.com/web-${CI_COMMIT_SHORT_SHA}.tar.gz -C ~/demo.showpls.com/public_html && rm -f ~/demo.showpls.com/web-${CI_COMMIT_SHORT_SHA}.tar.gz"
  <<: *conditions
  environment:
    name: $ENVIRONMENT_NAME
    action: start
