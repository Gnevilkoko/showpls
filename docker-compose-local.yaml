services:

  traefik:
    image: traefik:v3.1.0
    command:
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entryPoints=traefik"
      - "traefik.http.routers.api.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.routers.api.service=api@internal"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: 
      - 0.0.0.0:8000:80
      - 127.0.0.1:8001:8080
    networks:
      - mainnet

    environment:
      TZ: "Europe/Moscow"

  api:
    image: node:lts-alpine
    volumes:
      - ".:/app"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "cd /app && npm install && npm run dev:api"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) ||  PathPrefix(`/socket.io`)"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.url=http://127.0.0.1:8080"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - mainnet  

  web:
    image: node:lts-alpine
    volumes:
      - ".:/app"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "cd /app && npm install && npm run dev:web"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.url=http://127.0.0.1:3000"
      - "traefik.http.services.web.loadbalancer.server.port=3000"   
    networks:
      - mainnet     

  postgres:
    image: postgis/postgis:17-3.5-alpine
    env_file:
      - '.env.development'
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - mainnet  
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "Europe/Moscow"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      


  redis:
    image: redis:7.4.2-alpine
    env_file:
      - '.env.development'
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - mainnet  
    volumes:
      - redis_data:/data

    environment:
      TZ: "Europe/Moscow"



  nginx:
    image: nginx:latest
    user: root
    networks:
      - mainnet
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:rw
      - ./media:/app/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.nginx.service=nginx"
      - "traefik.http.routers.nginx.priority=10"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"

    environment:
      TZ: "Europe/Moscow"


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  letsencrypt:

networks:
  mainnet:


