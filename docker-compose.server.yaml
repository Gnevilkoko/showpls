# Полный compose для СЕРВЕРА. Использовать ТОЛЬКО его на сервере — данные в ./data/, не в томах.
# Запуск: cd ~/showpls-testnet && docker compose -f docker-compose.server.yaml up -d
# Перезапуск api/web: docker compose -f docker-compose.server.yaml restart api web

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entryPoints=traefik"
      - "traefik.http.routers.api.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.routers.api.service=api@internal"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8000:80"
      - "127.0.0.1:8001:8080"
    networks:
      - mainnet
    environment:
      TZ: "Europe/Moscow"

  # NODE_ENV=production обязательно: иначе API при старте дропает схему (dropSchema+synchronize) и данные теряются
  api:
    image: node:lts-alpine
    environment:
      NODE_ENV: production
    volumes:
      - ".:/app"
      - "api_node_modules:/app/node_modules"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "cd /app && npm ci --no-audit --include=dev && npm run dev:api"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/socket.io`)"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.url=http://api:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - mainnet

  web:
    image: node:lts-alpine
    volumes:
      - ".:/app"
      - "web_node_modules:/app/node_modules"
    environment:
      VITE_API_URL: "http://api:8080"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "cd /app && npm ci --no-audit && npm run dev:web"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.url=http://web:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - mainnet

  # Данные на диске (./data/postgres) — не том, docker compose down -v их не удалит
  postgres:
    image: postgis/postgis:17-3.5-alpine
    env_file:
      - ".env.development"
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - mainnet
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "Europe/Moscow"
    volumes:
      - "./data/postgres:/var/lib/postgresql/data/pgdata"

  # Данные на диске (./data/redis) — down -v не удалит
  redis:
    image: redis:7.4.2-alpine
    env_file:
      - ".env.development"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - mainnet
    volumes:
      - "./data/redis:/data"
    environment:
      TZ: "Europe/Moscow"

  nginx:
    image: nginx:latest
    user: root
    networks:
      - mainnet
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:rw
      - ./media:/app/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.nginx.service=nginx"
      - "traefik.http.routers.nginx.priority=10"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    environment:
      TZ: "Europe/Moscow"

volumes:
  letsencrypt:
  api_node_modules:
  web_node_modules:

networks:
  mainnet:
